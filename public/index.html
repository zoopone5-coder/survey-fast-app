<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Survey</title>
  <style>
    body{font:16px/1.4 sans-serif;max-width:520px;margin:16px auto;padding:0 12px;position:relative}
    form{display:grid;gap:10px}input,textarea,button{font:inherit;padding:10px}button{cursor:pointer}
    #msg{min-height:20px}.muted{color:#666}.preview{max-width:100%;display:block;border:1px solid #ccc}
    .download{display:none;text-align:center;background:#eee;color:#111;text-decoration:none;padding:10px;margin-top:6px;border:1px solid #ccc}
    #gallery{display:grid;gap:12px}
    #brand{position:fixed;top:10px;right:14px;font:700 12px/1 sans-serif;color:rgba(0,0,0,.18);letter-spacing:1px;pointer-events:none}
  </style>
</head>
<body>
  <div id="brand">HE2 VO1</div>
  <h1>Survey</h1>
  <form id="surveyForm">
    <input name="siteName" placeholder="Site Name / Site Number" required>
    <input name="village" placeholder="Village">
    <input name="taluka" placeholder="Taluka">
    <input name="hodName" placeholder="Site HoD Name">
    <input name="phone" placeholder="Phone Number" inputmode="tel">
    <input name="email" placeholder="Email" type="email">
    <input name="officeName" placeholder="Office Name">
    <input name="pincode" placeholder="Pincode" required inputmode="numeric" pattern="[0-9]{6}">
    <textarea name="remarks" rows="4" placeholder="Remarks if any"></textarea>
    <input id="photo" name="photo" type="file" accept="image/*" multiple required>
    <div id="fileInfo" class="muted">No photo selected</div>
    <div id="gps" class="muted">GPS: waiting</div>
    <div class="muted">Photo will be watermarked with site, pincode, GPS and date, then kept on phone.</div>
    <button id="downloadAllBtn" class="download" type="button">Download all photos</button>
    <div id="gallery"></div>
    <button id="submitBtn" type="submit" disabled>Submit</button>
    <div id="msg"></div>
  </form>
  <script src="/app.js" defer></script>
</body>
</html>
