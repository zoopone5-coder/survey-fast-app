<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Survey</title>
  <style>
    body{font:16px/1.4 sans-serif;max-width:520px;margin:16px auto;padding:0 12px}
    form{display:grid;gap:10px}input,textarea,button{font:inherit;padding:10px}button{cursor:pointer}
    #msg{min-height:20px}.muted{color:#666}
  </style>
</head>
<body>
  <h1>Survey</h1>
  <form id="surveyForm">
    <input name="siteName" placeholder="Site Name / Site Number" required>
    <input name="village" placeholder="Village">
    <input name="taluka" placeholder="Taluka">
    <input name="hodName" placeholder="Site HoD Name">
    <input name="phone" placeholder="Phone Number" inputmode="tel">
    <input name="email" placeholder="Email" type="email">
    <input name="officeName" placeholder="Office Name">
    <input name="pincode" placeholder="Pincode" required inputmode="numeric" pattern="[0-9]{6}">
    <textarea name="answers" rows="4" placeholder='Additional answers JSON, e.g. {"status":"ok"}'></textarea>
    <input id="photo" name="photo" type="file" accept="image/*" capture="environment" required>
    <div id="gps" class="muted">GPS: waiting</div>
    <div class="muted">Photo will be watermarked with site, pincode, GPS and date/time.</div>
    <button id="submitBtn" type="submit">Submit</button>
    <div id="msg"></div>
  </form>
  <script src="/app.js" defer></script>
</body>
</html>
